#VRML_SIM R2025a utf8
PROTO CourseRoad [
  field SFString name "horská trať"
  field SFVec3f translation 0 0 -50
  field SFRotation rotation 0 0 1 0
  field SFVec3f size 1 1.40 0.12
  field SFVec3f edgeSize 1 0.035 0.008
  field SFVec3f leftEdgeTranslation 0 0.682 0.064
  field SFVec3f rightEdgeTranslation 0 -0.682 0.064
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    children [
      Shape {
        appearance PBRAppearance { baseColor 0.78 0.82 0.84 roughness 0.82 }
        geometry Box { size IS size }
      }
      Transform {
        translation IS leftEdgeTranslation
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.06 0.30 0.32 emissiveColor 0.0 0.045 0.05 }
            geometry Box { size IS edgeSize }
          }
        ]
      }
      Transform {
        translation IS rightEdgeTranslation
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.06 0.30 0.32 emissiveColor 0.0 0.045 0.05 }
            geometry Box { size IS edgeSize }
          }
        ]
      }
    ]
    name IS name
    contactMaterial "track"
    boundingObject Box { size IS size }
  }
}
